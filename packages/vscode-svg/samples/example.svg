<?xml version="1.0" encoding="UTF-8"?>
<!-- 用于验证 SVG Outline 扩展：嵌套 g、带 id 与无 id 的元素混合。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <rect id="background" x="0" y="0" width="240" height="160" fill="#f5f5f5"/>
  <g id="frame" stroke="#333" fill="none">
    <rect id="outer" x="10" y="10" width="220" height="140" rx="8"/>
    <g id="markers">
      <circle id="top-left" cx="10" cy="10" r="4" fill="#333"/>
      <circle cx="230" cy="10" r="4" fill="#333"/>
      <circle cx="10" cy="150" r="4" fill="#333"/>
    </g>
  </g>
  <g id="caption" transform="translate(120 90)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">SVG Outline</text>
  </g>
</svg>
